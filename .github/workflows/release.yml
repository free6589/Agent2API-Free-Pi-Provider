name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    # The marker permits the first release to be created from a normal main
    # push when the caller cannot create Git tag refs directly. Other main
    # pushes only run CI; normal v* tag pushes keep working too.
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v0.1.1]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="$CARGO_VERSION"
            TAG="v$VERSION"
          fi
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Tag version ($VERSION) does not match Cargo.toml ($CARGO_VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Release build
        run: cargo build --release
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          TARGET="x86_64-unknown-linux-gnu"
          mkdir -p dist/stage/bin
          cp pack.json dist/stage/pack.json
          cp target/release/agent2api-free-pi-provider dist/stage/bin/
          (cd dist/stage && zip -qr "../agent2api-free-pi-provider-${VERSION}-${TARGET}.zip" pack.json bin)
      - name: Publish release asset and create tag when needed
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/agent2api-free-pi-provider-*-x86_64-unknown-linux-gnu.zip
