[package]
name = "agent2api-wasm-free-pi"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Agent2API WASM provider for the free-pi OpenAI-compatible API"
repository = "https://github.com/free6589/Agent2API-Free-Pi-Provider"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WASM 宿主只提供受控能力：网络、时钟、SSE、资源池都从 SDK 走，不接 WASI。
agent2api-wasm-sdk = { git = "https://github.com/ProvidersPlugin/Agent2Providers", rev = "7536f3c2b2497767f83be6cfff59cc1943d6860b" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
