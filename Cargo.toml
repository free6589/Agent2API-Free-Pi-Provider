[package]
name = "agent2api-free-pi-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Personal-use Agent2API provider for the free-pi OpenAI-compatible API"
repository = "https://github.com/free6589/Agent2API-Free-Pi-Provider"

[[bin]]
name = "agent2api-free-pi-provider"
path = "src/main.rs"

[dependencies]
agent2api-provider-protocol = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v3.4.0" }
agent2api-provider-sdk = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v3.4.0" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
